title = "sxPanel gitleaks config"

[extend]
useDefault = true

[allowlist]
paths = [
    '''node_modules''',
    '''monitor/node_modules''',
    '''\.git''',
    '''LIVE_SECURITY_RESULTS\.json''',
    '''THIRD-PARTY-LICENSES\.txt''',
    # Test fixtures: fake passwords, Discord snowflakes and tokens
    '''\.test\.ts$''',
    '''(^|/)core/testing/''',
    # Reviewed false positives (identifier names / UI strings, not credentials)
    '''core/modules/DiscordBot/logBatcher\.ts$''',
    '''nui/src/utils/constants\.ts$''',
    '''panel/src/pages/PlayerDropsPage/PlayerDropsPage\.tsx$''',
]
