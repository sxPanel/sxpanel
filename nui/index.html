<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="author" content="snipz" />
        <title>sxPanel NUI</title>
        <style>
            * {
                background-color: transparent;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>

        <!-- @citizenfx/three — FiveM's THREE.js build with CfxTexture for game screen capture -->
        <script src="nui://monitor/nui/cfx-three.min.js"></script>

        <script>
            (function () {
                // ---- Debug helper: no-op to avoid leaking capture activity to player console ----
                function slog(msg) {}

                // ---- Constants not exported by cfx-three.min.js ----
                var NEAREST_FILTER = 1003;

                // ---- State ----
                var pipelineReady = false;
                var renderer, sceneRTT, cameraRTT, rtTexture, material, gameTexture, captureWrap;
                var screenshotRequest = null;
                var streamRequest = null;
                var streamTimer = null;
                var streamSessionId = null;
                var streamQuality = 0.4;
                var frameCount = 0;

                // The render loop only runs while a screenshot/stream is pending, so idle
                // players pay nothing. A few frames are rendered before reading so CfxTexture
                // is warm after being idle.
                var WARMUP_FRAMES = 3;
                var loopRunning = false;
                var rafId = null;
                var warmFrames = 0;

                // ---- WebGL context lifecycle ----
                // All resources' NUI pages share one CEF renderer, and Chromium only keeps a
                // limited number of WebGL contexts alive (~16) before it evicts the oldest one.
                // So the context is created on demand, released after a period of inactivity,
                // and rebuilt from scratch if the GPU/browser drops it.
                var IDLE_RELEASE_MS = 30000;
                var REINIT_DELAY_MS = 1000;
                var MAX_REINIT_ATTEMPTS = 3;
                var idleTimer = null;
                var reinitTimer = null;
                var reinitAttempts = 0;

                function postNui(endpoint, payload) {
                    return fetch('https://monitor/' + endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                        body: JSON.stringify(payload),
                    });
                }

                function hasPendingWork() {
                    return !!(screenshotRequest || streamSessionId);
                }

                // ---- Pipeline setup (matches screenshot-basic exactly) ----
                function initialize() {
                    if (pipelineReady) return true;

                    var T = window.CFX_THREE;
                    if (!T) {
                        slog('FAIL: CFX_THREE not available');
                        return false;
                    }
                    if (!T.CfxTexture) {
                        slog('FAIL: CfxTexture not in CFX_THREE');
                        return false;
                    }

                    try {
                        var w = window.innerWidth;
                        var h = window.innerHeight;
                        slog('Initializing at ' + w + 'x' + h);

                        cameraRTT = new T.OrthographicCamera(w / -2, w / 2, h / 2, h / -2, -10000, 10000);
                        cameraRTT.position.z = 100;

                        sceneRTT = new T.Scene();

                        rtTexture = new T.WebGLRenderTarget(w, h, {
                            minFilter: T.LinearFilter,
                            magFilter: NEAREST_FILTER,
                            format: T.RGBAFormat,
                            type: T.UnsignedByteType,
                        });

                        gameTexture = new T.CfxTexture();
                        gameTexture.needsUpdate = true;

                        material = new T.ShaderMaterial({
                            uniforms: { tDiffuse: { value: gameTexture } },
                            vertexShader: [
                                'varying vec2 vUv;',
                                'void main() {',
                                '  vUv = vec2(uv.x, 1.0 - uv.y);',
                                '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
                                '}',
                            ].join('\n'),
                            fragmentShader: [
                                'varying vec2 vUv;',
                                'uniform sampler2D tDiffuse;',
                                'void main() {',
                                '  gl_FragColor = texture2D(tDiffuse, vUv);',
                                '}',
                            ].join('\n'),
                        });

                        var plane = new T.PlaneGeometry(w, h);
                        var quad = new T.Mesh(plane, material);
                        quad.position.z = -100;
                        sceneRTT.add(quad);

                        renderer = new T.WebGLRenderer();
                        renderer.setPixelRatio(window.devicePixelRatio);
                        renderer.setSize(w, h);
                        renderer.autoClear = false;
                        renderer.domElement.addEventListener('webglcontextlost', onContextLost, false);

                        captureWrap = document.createElement('div');
                        captureWrap.style.display = 'none';
                        document.body.appendChild(captureWrap);
                        captureWrap.appendChild(renderer.domElement);

                        window.addEventListener('resize', resize);
                        pipelineReady = true;
                        reinitAttempts = 0;
                        slog('Pipeline READY');
                        return true;
                    } catch (e) {
                        slog('INIT ERROR: ' + String(e));
                        teardown(true);
                        return false;
                    }
                }

                /**
                 * Destroys every GL resource and the canvas. With `release`, the context is
                 * explicitly freed (idle/failed init) so it stops counting against Chromium's
                 * limit. Listeners are removed first so three.js doesn't log a "Context Lost".
                 */
                function teardown(release) {
                    if (rafId !== null) {
                        cancelAnimationFrame(rafId);
                        rafId = null;
                    }
                    loopRunning = false;
                    window.removeEventListener('resize', resize);

                    if (sceneRTT) {
                        sceneRTT.children.forEach(function (child) {
                            if (child.geometry) child.geometry.dispose();
                        });
                    }
                    try {
                        if (rtTexture) rtTexture.dispose();
                        if (material) material.dispose();
                        if (gameTexture) gameTexture.dispose();
                    } catch (e) {}

                    if (renderer) {
                        renderer.domElement.removeEventListener('webglcontextlost', onContextLost, false);
                        try {
                            renderer.dispose();
                        } catch (e) {}
                        if (release) {
                            try {
                                renderer.forceContextLoss();
                            } catch (e) {}
                        }
                    }
                    if (captureWrap && captureWrap.parentNode) captureWrap.parentNode.removeChild(captureWrap);

                    renderer = sceneRTT = cameraRTT = rtTexture = material = gameTexture = captureWrap = null;
                    pipelineReady = false;
                }

                function onContextLost(event) {
                    // The context is unrecoverable for our purposes: three.js' restore path keeps
                    // stale texture/framebuffer handles, so rebuild everything from scratch instead.
                    event.preventDefault();
                    slog('WebGL context lost, rebuilding pipeline');
                    teardown(false);
                    if (hasPendingWork()) scheduleReinit();
                }

                function scheduleReinit() {
                    if (reinitTimer) return;
                    reinitTimer = setTimeout(function () {
                        reinitTimer = null;
                        if (!hasPendingWork()) return;

                        if (initialize()) {
                            ensureLoop();
                            return;
                        }
                        reinitAttempts++;
                        if (reinitAttempts < MAX_REINIT_ATTEMPTS) {
                            scheduleReinit();
                            return;
                        }

                        // Give up: report failure instead of leaving requests hanging.
                        reinitAttempts = 0;
                        if (screenshotRequest) {
                            var req = screenshotRequest;
                            screenshotRequest = null;
                            postNui('screenshotResult', {
                                requestId: req.requestId,
                                error: 'WebGL context lost and could not be restored',
                            }).catch(function () {});
                        }
                        if (streamSessionId) stopCapture();
                    }, REINIT_DELAY_MS);
                }

                function clearIdleRelease() {
                    if (idleTimer) {
                        clearTimeout(idleTimer);
                        idleTimer = null;
                    }
                }

                function scheduleIdleRelease() {
                    clearIdleRelease();
                    idleTimer = setTimeout(function () {
                        idleTimer = null;
                        if (!hasPendingWork() && pipelineReady) {
                            slog('Idle, releasing WebGL context');
                            teardown(true);
                        }
                    }, IDLE_RELEASE_MS);
                }

                /** Makes sure the pipeline exists and the loop is running for a new request. */
                function prepareForRequest() {
                    clearIdleRelease();
                    if (!pipelineReady && !initialize()) return false;
                    ensureLoop();
                    return true;
                }

                function resize() {
                    if (!pipelineReady) return;
                    var T = window.CFX_THREE;
                    if (!T) return;
                    var w = window.innerWidth;
                    var h = window.innerHeight;

                    cameraRTT = new T.OrthographicCamera(w / -2, w / 2, h / 2, h / -2, -10000, 10000);
                    cameraRTT.position.z = 100;

                    if (rtTexture) rtTexture.dispose();
                    rtTexture = new T.WebGLRenderTarget(w, h, {
                        minFilter: T.LinearFilter,
                        magFilter: NEAREST_FILTER,
                        format: T.RGBAFormat,
                        type: T.UnsignedByteType,
                    });

                    sceneRTT.children.forEach(function (child) {
                        if (child.geometry) child.geometry.dispose();
                    });
                    sceneRTT = new T.Scene();
                    var plane = new T.PlaneGeometry(w, h);
                    var quad = new T.Mesh(plane, material);
                    quad.position.z = -100;
                    sceneRTT.add(quad);

                    renderer.setSize(w, h);
                }

                // ---- Render loop ----
                function ensureLoop() {
                    if (loopRunning) return;
                    loopRunning = true;
                    warmFrames = 0;
                    rafId = requestAnimationFrame(animate);
                }

                function animate() {
                    rafId = null;
                    if (!pipelineReady || !hasPendingWork()) {
                        loopRunning = false;
                        if (pipelineReady) scheduleIdleRelease();
                        return;
                    }

                    // The lost event can arrive after the loss; never read pixels from a dead
                    // context (they come back all zeros = black screenshot).
                    var gl = renderer.getContext();
                    if (gl && gl.isContextLost()) {
                        teardown(false);
                        scheduleReinit();
                        return;
                    }

                    rafId = requestAnimationFrame(animate);

                    renderer.clear();
                    renderer.render(sceneRTT, cameraRTT, rtTexture, true);
                    if (warmFrames < WARMUP_FRAMES) {
                        warmFrames++;
                        return;
                    }

                    if (screenshotRequest) {
                        var req = screenshotRequest;
                        screenshotRequest = null;
                        handleScreenshot(req);
                    }

                    if (streamRequest) {
                        streamRequest = false;
                        handleStreamFrame();
                    }
                }

                // ---- Screenshot handler ----
                function handleScreenshot(req) {
                    slog('handleScreenshot id=' + req.requestId);
                    try {
                        var w = window.innerWidth;
                        var h = window.innerHeight;

                        var read = new Uint8Array(w * h * 4);
                        renderer.readRenderTargetPixels(rtTexture, 0, 0, w, h, read);

                        var canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        var ctx = canvas.getContext('2d');
                        ctx.putImageData(new ImageData(new Uint8ClampedArray(read.buffer), w, h), 0, 0);

                        var type = 'image/jpeg';
                        if (req.encoding === 'png') type = 'image/png';
                        else if (req.encoding === 'webp') type = 'image/webp';

                        var quality = req.quality || 0.92;
                        var dataUrl = canvas.toDataURL(type, quality);
                        slog('Screenshot encoded len=' + dataUrl.length);

                        postNui('screenshotResult', { requestId: req.requestId, data: dataUrl })
                            .then(function (r) {
                                slog('Screenshot POST status=' + r.status);
                            })
                            .catch(function (e) {
                                slog('Screenshot POST FAILED: ' + e);
                            });
                    } catch (e) {
                        slog('Screenshot ERROR: ' + e);
                        postNui('screenshotResult', { requestId: req.requestId, error: String(e) }).catch(
                            function () {},
                        );
                    }
                }

                // ---- Stream frame handler ----
                function handleStreamFrame() {
                    if (!streamSessionId) return;
                    frameCount++;
                    try {
                        var w = window.innerWidth;
                        var h = window.innerHeight;

                        var read = new Uint8Array(w * h * 4);
                        renderer.readRenderTargetPixels(rtTexture, 0, 0, w, h, read);

                        var sw = Math.max(1, Math.floor(w * 0.5));
                        var sh = Math.max(1, Math.floor(h * 0.5));
                        var canvas = document.createElement('canvas');
                        canvas.width = sw;
                        canvas.height = sh;
                        var ctx = canvas.getContext('2d');

                        var fullCanvas = document.createElement('canvas');
                        fullCanvas.width = w;
                        fullCanvas.height = h;
                        var fullCtx = fullCanvas.getContext('2d');
                        fullCtx.putImageData(new ImageData(new Uint8ClampedArray(read.buffer), w, h), 0, 0);
                        ctx.drawImage(fullCanvas, 0, 0, sw, sh);

                        var dataUrl = canvas.toDataURL('image/webp', streamQuality);

                        if (frameCount <= 3) {
                            slog('Frame #' + frameCount + ' len=' + dataUrl.length);
                        }

                        postNui('spectateFrame', { sessionId: streamSessionId, frameData: dataUrl })
                            .then(function (r) {
                                if (frameCount <= 3) slog('Frame POST status=' + r.status);
                            })
                            .catch(function (e) {
                                if (frameCount <= 3) slog('Frame POST FAILED: ' + e);
                            });
                    } catch (e) {
                        slog('Stream ERROR: ' + e);
                    }
                }

                // ---- Start/Stop streaming ----
                function startCapture(sessionId, fps, quality) {
                    slog('startCapture session=' + sessionId + ' fps=' + fps);
                    if (streamTimer) {
                        slog('Already streaming, ignoring');
                        return;
                    }

                    streamSessionId = sessionId;
                    streamQuality = quality || 0.4;
                    frameCount = 0;

                    if (!prepareForRequest()) {
                        slog('FAIL: Cannot start — init failed');
                        streamSessionId = null;
                        return;
                    }

                    var interval = Math.floor(1000 / (fps || 5));
                    streamTimer = setInterval(function () {
                        streamRequest = true;
                    }, interval);

                    streamRequest = true;
                    slog('Streaming started, interval=' + interval + 'ms');
                }

                function stopCapture() {
                    slog('stopCapture');
                    streamSessionId = null;
                    streamRequest = false;
                    frameCount = 0;
                    if (streamTimer) {
                        clearInterval(streamTimer);
                        streamTimer = null;
                    }
                }

                function takeScreenshot(d) {
                    screenshotRequest = {
                        requestId: d.requestId,
                        quality: d.quality || 0.92,
                        encoding: d.encoding || 'jpg',
                    };
                    if (!prepareForRequest()) {
                        slog('FAIL: takeScreenshot but init failed');
                        screenshotRequest = null;
                        postNui('screenshotResult', { requestId: d.requestId, error: 'Pipeline init failed' }).catch(
                            function () {},
                        );
                    }
                }

                // ---- Message handler ----
                window.addEventListener('message', function (event) {
                    var msg = event.data;
                    if (!msg || !msg.action) return;

                    if (msg.action === 'startCapture') {
                        var start = msg.data || {};
                        slog('NUI msg: startCapture ' + JSON.stringify(start));
                        startCapture(start.sessionId, start.fps, start.quality);
                    } else if (msg.action === 'stopCapture') {
                        slog('NUI msg: stopCapture');
                        stopCapture();
                    } else if (msg.action === 'takeScreenshot') {
                        var shot = msg.data || {};
                        slog('NUI msg: takeScreenshot ' + JSON.stringify(shot));
                        takeScreenshot(shot);
                    }
                });

                // Signal to React hook: inline engine is active. The WebGL pipeline itself is
                // created lazily on the first capture request (see prepareForRequest).
                window.__inlineCaptureEngine = true;
                slog('Script loaded, CFX_THREE=' + !!window.CFX_THREE);
            })();
        </script>

        <!-- React app (menu UI) — loaded AFTER capture engine -->
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
