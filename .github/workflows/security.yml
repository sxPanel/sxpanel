name: Security Scan

on:
    push:
        branches: [main, dev]
    pull_request:

permissions:
    contents: read

jobs:
    gitleaks:
        name: gitleaks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install gitleaks
              env:
                  GITLEAKS_VERSION: 8.30.1
              run: |
                  base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
                  curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
                  grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
                  tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
                  sudo mv gitleaks /usr/local/bin/gitleaks

            - name: Run gitleaks
              run: gitleaks git --config scripts/security/.gitleaks.toml --redact --verbose
